<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container mt-5" style="max-width: 400px;">
    <div class="card">
      <h3 class="text-center">Farmer Login</h3>
      <form id="loginForm">
        <input type="text" class="form-control mb-3" id="phone" placeholder="Phone Number" required>
        <input type="password" class="form-control mb-3" id="password" placeholder="Password" required>
        <button type="submit" class="btn btn-success w-100">Login</button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = {
        phone: document.getElementById('phone').value,
        password: document.getElementById('password').value
      };
      const res = await fetch('http://localhost:5000/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const result = await res.json();
      if (res.ok) {
        localStorage.setItem('token', result.token);
        localStorage.setItem('farmerName', result.farmer.name);
        window.location = 'dashboard.html';
      } else {
        alert(result.error);
      }
    });
  </script>
</body>
</html>
