<!DOCTYPE html>
<html>
<head>
  <title>Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container mt-5" style="max-width: 500px;">
    <div class="card">
      <h3 class="text-center">Farmer Registration</h3>
      <form id="registerForm">
        <input type="text" class="form-control mb-3" id="name" placeholder="Full Name" required>
        <input type="text" class="form-control mb-3" id="phone" placeholder="Phone Number" required>
        <input type="password" class="form-control mb-3" id="password" placeholder="Password" required>
        <input type="text" class="form-control mb-3" id="village" placeholder="Village" required>
        <button type="submit" class="btn btn-success w-100">Register</button>
      </form>
      <p class="mt-3 text-center">Already have account? <a href="login.html">Login</a></p>
    </div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = {
        name: document.getElementById('name').value,
        phone: document.getElementById('phone').value,
        password: document.getElementById('password').value,
        village: document.getElementById('village').value
      };
      const res = await fetch('http://localhost:5000/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const result = await res.json();
      if (res.ok) {
        alert('Registered successfully! Please login.');
        window.location = 'login.html';
      } else {
        alert(result.error);
      }
    });
  </script>
</body>
</html>
